name: playnux
arch: ${GOARCH}
platform: linux
version: ${PLAYNUX_PACKAGE_VERSION}
release: "1"
section: games
priority: optional
maintainer: Playnux Contributors <Ywtoo@users.noreply.github.com>
description: A unified game library and launcher for Linux.
homepage: https://github.com/Ywtoo/Playnux
license: MIT

contents:
  - src: ${PLAYNUX_PACKAGE_BINARY}
    dst: /usr/bin/playnux
    expand: true
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/playnux.png
  - src: ./build/linux/desktop
    dst: /usr/share/applications/playnux.desktop
  - src: ../LICENSE.md
    dst: /usr/share/doc/playnux/copyright
  - src: ../CREDITS.md
    dst: /usr/share/doc/playnux/CREDITS.md

depends:
  - libgtk-3-0t64 | libgtk-3-0
  - libwebkit2gtk-4.1-0
  - libx11-6
recommends:
  - gstreamer1.0-plugins-good
  - gstreamer1.0-libav

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - libX11
    recommends:
      - gstreamer1-plugins-good
      - gstreamer1-plugin-libav
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
      - libx11
    recommends:
      - gst-plugins-good
      - gst-libav
