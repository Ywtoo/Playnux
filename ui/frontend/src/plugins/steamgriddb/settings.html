<section data-integration-panel="steamgriddb" hidden>
  <h3>SteamGridDB</h3>
  <form class="integration-provider" data-provider="steamgriddb">
    <fieldset class="desktop-group">
      <legend>SteamGridDB credentials</legend>
      <div class="settings-credential"><span data-provider-state="steamgriddb" role="status"></span></div>
      <details class="settings-help">
        <summary>How to get credentials</summary>
        <ol class="plugin-instructions">
          <li>Open the API preferences and sign in to your SteamGridDB account.</li>
          <li>Generate a personal API key and copy it.</li>
          <li>Paste the key below and select Save.</li>
        </ol>
        <p><button type="button" class="ghost-button" data-help-url="https://www.steamgriddb.com/profile/preferences/api">Open API key page…</button></p>
      </details>
      <div class="desktop-fields">
        <label for="steamgrid-key">API key</label>
        <input id="steamgrid-key" name="key" type="password" autocomplete="off" required>
      </div>
      <div class="desktop-actions">
        <button type="submit" class="primary-button">Save</button>
        <button type="button" class="ghost-button" data-clear-provider>Remove credentials</button>
      </div>
    </fieldset>
  </form>
</section>
