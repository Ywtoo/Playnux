<form>
  <fieldset class="desktop-group">
    <legend>Game folders</legend>
    <p>Playnux scans for Linux executables and .sh scripts. Each subfolder can become a game.</p>
    <label for="linux-folder">Folder</label>
    <div class="path-row">
      <input id="linux-folder" type="text" placeholder="~/Games" autocomplete="off" spellcheck="false" required>
      <button type="button" class="ghost-button" data-browse>Browse…</button>
    </div>
    <div class="desktop-actions">
      <button type="submit" class="primary-button">Add and scan</button>
    </div>
    <div class="folder-list" aria-live="polite"></div>
  </fieldset>
</form>
