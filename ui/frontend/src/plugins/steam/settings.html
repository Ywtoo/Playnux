<form data-steam-account>
  <fieldset class="desktop-group">
    <legend>Steam account</legend>
    <p>O SteamID64 importa os jogos instalados. A chave da Steam Web API permite importar também os jogos comprados que ainda não foram instalados.</p>
    <div class="desktop-fields">
      <label for="steam-id">SteamID64</label>
      <div class="path-row">
        <input id="steam-id" name="account" inputmode="numeric" pattern="7656119[0-9]{10}" autocomplete="off" required>
        <button type="button" class="ghost-button" data-steam-detect>Use this PC’s account</button>
      </div>
      <label for="steam-api-key">API key (owned games)</label>
      <input id="steam-api-key" name="key" type="password" autocomplete="off" placeholder="Leave blank to keep the saved key">
    </div>
    <label class="plugin-checkbox"><input type="checkbox" name="clearKey"> Remove saved key</label>
    <div class="desktop-actions">
      <button type="submit" class="primary-button">Save account and sync</button>
    </div>
  </fieldset>
</form>
